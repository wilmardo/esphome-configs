---
packages:
  - !include _common-esphome.yml

esp32:
  variant: esp32c6
  framework:
    type: esp-idf

esphome:
  name: heatpumpmeter

wifi:
  manual_ip:
    static_ip: 192.168.1.55

external_components:
  - source:
      type: git
      url: https://github.com/brambo123/esphome-sensostar
    components: [ SensoStar_MBus ]

status_led:
  pin: GPIO1

uart:
  - id: uart_mbus
    tx_pin: GPIO4
    rx_pin: GPIO5
    baud_rate: 2400
    parity: EVEN

  - id: uart_modbus
    tx_pin: GPIO2
    rx_pin: GPIO3
    flow_control_pin: GPIO0
    parity: EVEN
    baud_rate: 9600

modbus:
  - id: modbus1  # must NOT be just modbus, wont compile
    uart_id: uart_modbus
    send_wait_time: 400ms

SensoStar_MBus:
  id: sensostar_mbus
  uart_id: uart_mbus
  update_interval: never  # do this in interval below

# use interval to read all meters at the same time
interval:
  - interval: 10s
    startup_delay: 10s
    then:
      - component.update: sensostar_mbus
      - component.update: heatpump_meter
      - component.update: backupheater_meter

sensor:
  - platform: SensoStar_MBus
    energy:
      name: SensoStar Energy
    volume:
      name: SensoStar Volume
    power:
      name: SensoStar Power
      id: sensostar_power
      on_value:
        then:
          - component.update: heatpump_combined_power
          - component.update: cop
    flow:
      name: SensoStar Flow
    temperature_flow:
      name: SensoStar Flow Temperature
    temperature_return:
      name: SensoStar Return Temperature
    temperature_diff:
      name: SensoStar Temperature Difference
    calculated_power:
      name: SensoStar Calculated Power
  # Two modbus meters
  - platform: sdm_meter
    id: heatpump_meter
    modbus_id: modbus1
    address: 1
    update_interval: never
    phase_a:
      active_power:
        id: heatpump_power
        name: Heatpump Power
    import_active_energy:
      name: Heatpump Import Active Energy
  - platform: sdm_meter
    id: backupheater_meter
    modbus_id: modbus1
    address: 2
    update_interval: never
    phase_a:
      active_power:
        id: backupheater_power
        name: Heatpump Backupheater Power
    import_active_energy:
      name: Heatpump Backupheater Import Active Energy
  # Total power
  - platform: template
    id: heatpump_combined_power
    name: Heatpump combined power
    accuracy_decimals: 2
    unit_of_measurement: W
    lambda: |-
      if (id(heatpump_power).state > 100 or id(backupheater_power).state > 100 ) {
        return id(heatpump_power).state + id(heatpump_power).state;
      }
      return 0.0;
    update_interval: never
  # COP calculation
  - platform: template
    id: cop
    name: COP
    accuracy_decimals: 2
    state_class: measurement
    unit_of_measurement: CoP
    lambda: |-
      if (id(heatpump_power).state > 100) {
        return abs(id(sensostar_power).state) / id(heatpump_combined_power).state;
      }
      return 0.0;
    update_interval: never

text_sensor:
  - platform: SensoStar_MBus
    status:
      name: SensoStar Status
